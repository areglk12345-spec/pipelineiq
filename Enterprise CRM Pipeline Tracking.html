document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    <div>\n        <div style=\"font-weight:700;font-size:19px;color:#fff;letter-spacing:.2px\">PipelineIQ<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8a97ad;font-weight:500\">Sales Tracking Suite<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:18px;padding:30px 32px;box-shadow:0 24px 60px rgba(6,12,24,.45)\">\n      <sc-if value=\"{{ isLoginMode }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-size:17px;font-weight:700;color:#0f1b2d;margin-bottom:4px\">เข้าสู่ระบบ<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#94a1b3;margin-bottom:22px\">ลงชื่อเข้าใช้ด้วยบัญชีองค์กรของคุณ<\u002Fdiv>\n      <label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">Username / Email<\u002Flabel>\n      <input value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\" placeholder=\"เช่น somchai\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:10px;padding:12px 14px;font-size:13.5px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fbfcfe;margin-bottom:16px\">\n      <label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">Password<\u002Flabel>\n      <div style=\"position:relative;margin-bottom:8px\">\n        <input type=\"{{ loginPwType }}\" value=\"{{ loginPw }}\" sc-camel-on-change=\"{{ onLoginPw }}\" placeholder=\"รหัสผ่าน\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:10px;padding:12px 40px 12px 14px;font-size:13.5px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fbfcfe\">\n        <button sc-camel-on-click=\"{{ toggleLoginPw }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;background:transparent;color:#8a97ad;cursor:pointer;display:flex;align-items:center;justify-content:center\">\n          <sc-if value=\"{{ loginPwHidden }}\" hint-placeholder-val=\"{{ true }}\">\n            <svg width=\"16\" height=\"16\" sc-camel-vie \n        Show Demo — เข้าชมระบบตัวอย่าง\n      <\u002Fbutton>\n      <div style=\"text-align:center;margin-bottom:16px\">\n        <span style=\"font-size:12px;color:#94a1b3\">ยังไม่มีบัญชี? <\u002Fspan>\n        <a href=\"#\" sc-camel-on-click=\"{{ goRegister }}\" style=\"font-size:12px;font-weight:700;color:#2f5fe0;text-decoration:none;cursor:pointer\">สร้างบัญชีใหม่<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px;justify-content:center;margin-top:6px;padding-top:16px;border-top:1px solid #eef1f5\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px;color:#94a1b3\">ระบบยืนยันตัวตน 2 ขั้น (2FA/OTP) จะทำงานหลังกรอกรหัสผ่านถูกต้อง<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegisterMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ regNotDone }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:17px;font-weight:700;color:#0f1b2d;margin-bottom:4px\">สร้างบัญชีใหม่<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#94a1b3;margin-bottom:22px\">กรอกข้อมูลเพื่อส่งคำขอสร้างบัญชี — IT Admin จะตรวจสอบและอนุมัติ<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:14px\">\n          <div><label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">ชื่อจริง<\u002Flabel><input placeholder=\"เช่น อภิชาติ\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;color:#0f1b2d;background:#fbfcfe\"><\u002Fdiv>\n          <div><label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">นามสกุล<\u002Flabel><input placeholder=\"เช่น รุ่งโรจน์\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;color:#0f1b2d;background:#fbfcfe\"><\u002Fdiv>\n          <div style=\"grid-column:span 2\"><label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">อีเมลองค์กร<\u002Flabel><input placeholder=\"name.s@company.co.th\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fbfcfe\"><\u002Fdiv>\n          <div><label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">รหัสผ่าน<\u002Flabel><input type=\"password\" placeholder=\"ตาม Password Policy\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fbfcfe\"><\u002Fdiv>\n          <div><label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">ยืนยันรหัสผ่าน<\u002Flabel><input type=\"password\" placeholder=\"กรอกซ้ำอีกครั้ง\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fbfcfe\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submitRegister }}\" style=\"width:100%;background:#2f5fe0;border:none;color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:14px\">ส่งคำขอสร้างบัญชี<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ regDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:18px 0 8px\">\n          <svg width=\"42\" height=\"42\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:12px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12l3 3 5-6\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-size:15px;font-weight:700;color:#0f1b2d;margin-bottom:6px\">ส่งคำขอเรียบร้อย<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a869a;line-height:1.6;margin-bottom:18px\">IT Admin จะตรวจสอบและอนุมัติบัญชีของคุณ<br>ลิงก์ตั้งค่า 2FA จะถูกส่งไปที่อีเมลเมื่ออนุมัติแล้ว<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"text-align:center\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goLoginMode }}\" style=\"font-size:12px;font-weight:700;color:#2f5fe0;text-decoration:none;cursor:pointer\">← กลับไปหน้าเข้าสู่ระบบ<\u002Fa>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOtpStage }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;margin-bottom:20px\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#e8f6ed;display:flex;align-items:center;justify-content:center;margin:0 auto 14px\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;color:#0f1b2d;margin-bottom:5px\">ยืนยันตัวตน 2 ขั้น (2FA)<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#94a1b3;line-height:1.55\">รหัสผ่านถูกต้อง — เลือกช่องทางรับรหัส OTP<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ otpChannelNotPicked }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:16px\">\n            <sc-for list=\"{{ otpChannels }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"display:flex;align-items:center;gap:12px;border:1px solid #e2e7ee;background:#fbfcfe  Plex Sans\" font-size=\"11\" fill=\"#b3bdcb\">0%<\u002Ftext>\n                <text x=\"174\" y=\"116\" text-anchor=\"middle\" font-family=\"IBM Plex Sans\" font-size=\"11\" fill=\"#b3bdcb\">100%<\u002Ftext>\n              <\u002Fsvg>\n              <div style=\"display:flex;gap:26px;margin-top:8px\">\n                <div style=\"text-align:center\"><div style=\"font-size:19px;font-weight:700;color:#16a34a;font-family:'IBM Plex Sans'\">4<\u002Fdiv><div style=\"font-size:11px;color:#94a1b3\">ปิดได้<\u002Fdiv><\u002Fdiv>\n                <div style=\"width:1px;background:#e8edf3\"><\u002Fdiv>\n                <div style=\"text-align:center\"><div style=\"font-size:19px;font-weight:700;color:#dc2626;font-family:'IBM Plex Sans'\">2<\u002Fdiv><div style=\"font-size:11px;color:#94a1b3\">พลาด<\u002Fdiv><\u002Fdiv>\n                <div style=\"width:1px;background:#e8edf3\"><\u002Fdiv>\n                <div style=\"text-align:center\"><div style=\"font-size:19px;font-weight:700;color:#0f1b2d;font-family:'IBM Plex Sans'\">15<\u002Fdiv><div style=\"font-size:11px;color:#94a1b3\">ดีลทั้งหมด<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FUNNEL -->\n        <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:24px 28px;box-shadow:0 1px 2px rgba(15,27,45,.04)\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px\">\n            <div>\n              <div style=\"font-size:15px;font-weight:700;color:#0f1b2d\">กรวยไปป์ไลน์การขาย (Sales Pipeline Funnel)<\u002Fdiv>\n              <div style=\"font-size:12px;color:#94a1b3;margin-top:2px\">มูลค่ารวมและจำนวนดีลที่หมุนเวียน แยกตามสถานะ · อัปเดตเรียลไทม์<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right\">\n              <div style=\"font-size:11.5px;color:#94a1b3\">มูลค่ารวมในไปป์ไลน์<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#0f1b2d;font-family:'IBM Plex Sans'\">฿200,500,000<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- proportional stage bar -->\n          <div style=\"display:flex;width:100%;height:40px;border-radius:10px;overflow:hidden;margin-bottom:22px;box-shadow:inset 0 0 0 1px #e2e7ee\">\n            <sc-for list=\"{{ funnelStages }}\" as=\"stage\" hint-placeholder-count=\"5\">\n              <div style=\"flex:{{ stage.flexVal }};background:{{ stage.dot }};border-right:2px solid #fff;min-width:2px\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <!-- stage cards -->\n          <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px\">\n            <sc-for list=\"{{ funnelStages }}\" as=\"stage\" hint-placeholder-count=\"5\">\n              <div style=\"background:{{ stage.bg }};border-radius:12px;padding:16px 16px 15px;border-bottom:3px solid {{ stage.dot }}\">\n                <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:10px\">\n                  <span style=\"width:9px;height:9px;border-radius:3px;background:{{ stage.dot }};flex:none\"><\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:700;color:{{ stage.fg }}\">{{ stage.label }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#7a869a;margin-bottom:12px;line-height:1.3;min-height:15px\">{{ stage.sub }}<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#0f1b2d;font-family:'IBM Plex Sans';line-height:1.2\">{{ stage.valueFmt }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#7a869a;margin-top:3px\">{{ stage.count }} ดีล<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== KANBAN (registry table) ===== -->\n      <sc-if value=\"{{ isKanban }}\" hint-placeholder-val=\"{{ false gerFilterChange }}\" style=\"border:none;background:transparent;font-size:12.5px;color:#0f1b2d;font-weight:600;font-family:inherit;outline:none;cursor:pointer\">\n                      <option value=\"all\">ภาพรวมทั้งทีม<\u002Foption>\n                      <sc-for list=\"{{ salesOptions }}\" as=\"s\" hint-placeholder-count=\"0\">\n                        <option value=\"{{ s }}\">{{ s }}<\u002Foption>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ goForm }}\" style=\"display:flex;align-items:center;gap:7px;background:#2f5fe0;color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">+ เพิ่มดีล<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <!-- status tabs -->\n          <div style=\"display:flex;align-items:center;gap:2px;padding:4px 14px 0;border-bottom:1px solid #e8edf3\">\n            <sc-for list=\"{{ dealTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">\n                {{ t.label }}\n                <sc-if value=\"{{ t.showCount }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"{{ t.badgeStyle }}\">{{ t.count }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- table head -->\n          <div style=\"display:grid;grid-template-columns:170px 1fr 130px 190px 200px;gap:14px;padding:11px 20px;background:#f7f9fc;border-bottom:1px solid #eef1f5;font-size:11px;font-weight:700;letter-spacing:.4px;color:#94a1b3\">\n            <div>สถานะ<\u002Fdiv><div>บริษัท / โครงการ<\u002Fdiv><div style=\"text-align:right\">มูลค่า<\u002Fdiv><div>Sales ที่ดูแล<\u002Fdiv><div>เหตุผล / อัปเดตล่าสุด<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- rows -->\n          <sc-for list=\"{{ dealRows }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ d.open }}\" style=\"display:grid;grid-template-columns:170px 1fr 130px 190px 200px;gap:14px;padding:15px 20px;border-bottom:1px solid #f2f5f9;align-items:start;cursor:pointer\" style-hover=\"background:#f7f9fc\">\n              <div><span style=\"{{ d.stStyle }}\"><span style=\"{{ d.dotStyle }}\"><\u002Fspan>{{ d.stLabel }}<\u002Fspan><div style=\"font-size:10.5px;color:#94a1b3;margin-top:4px\">{{ d.stSub }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;line-height:1.35\">{{ d.company }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#7a869a;margin-top:2px;line-height:1.4\">{{ d.project }} · {{ d.service }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;font-size:13.5px;font-weight:700;color:#0f1b2d;font-family:'IBM Plex Sans'\">{{ d.valueFmt }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                <span style=\"width:26px;height:26px;flex:none;border-radius:50%;background:#eaf0fb;color:#2f5fe0;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ d.initial }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#3f4a5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ d.sales }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#7a869a;line-height:1.5\">{{ d.reason }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ dealRowsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:44px;text-align:center\">\n              <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c3cdda\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:8px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n              <div style=\"font-size:13px;font-weight:600;color:#5b6779\">ไม่พบดีลที่ตรงกับเงื่อนไข<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#94a1b3;margin-top:3px\">ลองเปลี่ยนคำค้นหาหรือแท็บสถานะ<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fbfcfe;border-top:1px solid #eef1f5\">\n            <span style=\"font-size:11.5px;color:#94a1b3\">คลิกที่แถวเพื่อเปิดรายละเอียดดีล 17 ข้อ + Action Logs<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#94a1b3\">จำนวนต่อหน้า 15 · หน้า 1 จาก 1<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <!-- ===== CUSTOMERS DATA BANK ===== -->\n      <sc-if value=\"{{ isCustomers }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:22px 30px 48px\">\n        <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:14px;box-shadow:0 1px 2px rgba(15,27,45,.04);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #e8edf3\">\n            <div style=\"display:flex;align-items:center;gap:9px;background:#f7f9fc;border:1px solid #e2e7ee;border-radius:9px;padding:8px 13px;width:340px\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94a1b3\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n              <input value=\"{{ custSearch }}\" sc-camel-on-change=\"{{ onCustSearch }}\" placeholder=\"ค้นหา — รหัส, ชื่อหน่วยงาน, ประเภท, ผู้ดูแล\" style=\"flex:1;border:none;background:transparent;font-size:12.5px;font-family:inherit;color:#0f1b2d;outline:none\">\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#7a869a\">ทั้งหมด <b style=\"color:#0f1b2d\">{{ custCount }}<\u002Fb> หน่วยงาน<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ openCustAdd }}\" style=\"margin-left:auto;display:flex;align-items:center;gap:7px;background:#2f5fe0;border:none;color:#fff;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer\">+ เพิ่มหน่วยงาน<\u002Fbutton>\n          <\u002Fdiv>\n          <!-- table head -->\n          <div style=\"display:grid;grid-template-columns:80px 1.4fr 130px 140px 1fr 1.2fr 110px;gap:14px;padding:11px 20px;background:#f7f9fc;border-bottom:1px solid #eef1f5;font-size:11px;font-weight:700;letter-spacing:.4px;color:#94a1b3\">\n            <div>รหัส<\u002Fdiv><div>ชื่อหน่วยงาน<\u002Fdiv><div>ประเภท<\u002Fdiv><div>เบอร์ติดต่อ<\u002Fdiv><div>ผู้ดูแลปัจจุบัน<\u002Fdiv><div>โครงการล่าสุด<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ custRows }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:80px 1.4fr 130px 140px 1fr 1.2fr 110px;gap:14px;padding:15px 20px;border-bottom:1px solid #f2f5f9;align-items:start\">\n              <div style=\"font-size:12.5px;font-weight:700;color:#2f5fe0;font-family:'IBM Plex Mono'\">{{ c.code }}<\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;line-height:1.35\">{{ c.name }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#94a1b3;margin-top:2px\">POC: {{ c.poc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div><span style=\"{{ c.typeStyle }}\">{{ c.type }}<\u002Fspan><\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:12px;color:#3f4a5a;font-family:'IBM Plex Sans';line-height:1.4;white-space:nowrap;overflow:hidden;text-ove  <div style=\"flex:1;min-width:220px\">\n              <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:3px\">ที่นั่งเสริม (Add-on)<\u002Fdiv>\n              <div style=\"font-size:12px;color:#7a869a\">เพิ่มสมาชิกเกินแผน คิดเพิ่ม <b style=\"color:#0f1b2d;font-family:'IBM Plex Sans'\">฿500/คน/เดือน<\u002Fb><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <button sc-camel-on-click=\"{{ seatMinus }}\" style=\"width:32px;height:32px;border:1px solid #d9e0e9;background:#fff;color:#5b6779;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit\">−<\u002Fbutton>\n              <span style=\"font-size:20px;font-weight:700;color:#0f1b2d;font-family:'IBM Plex Sans';min-width:34px;text-align:center\">{{ extraSeats }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ seatPlus }}\" style=\"width:32px;height:32px;border:1px solid #d9e0e9;background:#fff;color:#5b6779;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit\">+<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"text-align:right\">\n              <div style=\"font-size:14px;font-weight:700;color:#2f5fe0;font-family:'IBM Plex Sans'\">{{ extraSeatCost }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:#94a1b3\">{{ totalCycleLabel }}: <b style=\"color:#0f1b2d;font-family:'IBM Plex Sans'\">{{ monthlyTotal }}<\u002Fb><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;background:#f4f7fb;border:1px solid #e2e8f0;border-radius:11px;padding:13px 16px;display:flex;gap:11px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5b7089\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8h.01M11 12h1v4h1\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:12px;color:#5b6779;line-height:1.55\">ทุกแผนแบบชำระรายเดือน เพิ่มที่นั่งเกินแผนได้ครั้งละ 1 คน (฿500/คน/เดือน) · แผนฟรีดูข้อมูลได้อย่างเดียว ไม่สามารถเพิ่ม/แก้ไข/ลบดีลได้ · เมื่อหมดอายุระบบจะปรับเป็นแผนฟรีอัตโนมัติ<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- payment history -->\n        <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:24px 28px;box-shadow:0 1px 2px rgba(15,27,45,.04);margin-top:20px\">\n          <div style=\"font-size:15px;font-weight:700;color:#0f1b2d;margin-bottom:14px\">ประวัติการชำระเงิน<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:0;font-size:12.5px\">\n            <div style=\"padding:9px 12px;font-weight:700;color:#94a1b3;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #eef1f5\">วันที่<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-weight:700;color:#94a1b3;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #eef1f5\">รายการ<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-weight:700;color:#94a1b3;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #eef1f5\">ช่องทาง<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-weight:700;color:#94a1b3;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #eef1f5\">ยอด<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-weight:700;color:#94a1b3;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #eef1f5\">สถานะ<\u002Fdiv>\n            <sc-for list=\"{{ paymentHistory }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"padding:10px 12px;color:#3f4a5a;border-bottom:1px solid #f4f6f9;font-family:'IBM Plex Sans'\">{{ h.date }}<\u002Fdiv>\n              <div style=\"padding:10px 12px;color:#0f1b2d;font-weight:500;border-bottom:1px solid #f4f6f9\">{{ h.item }}<\u002Fdiv>\n              <div style=\"padding:10px 12px;color:#3f4a5a;border-bottom:1px solid #f4f6f9\">{{ h.method }}<\u002Fdiv>\n              <div style=\"padding:10px 12px;color:#0f1b2d;font-weight:700;border-bottom:1px solid #f4f6f9;font-family:'IBM Plex Sans'\">{{ h.amount }}<\u002Fdiv>\n              <div style=\"padding:10px 12px;border-bottom:1px solid #f4f6f9\"><span style=\"font-size:10.5px;font-weight:700;color:#12813b;background:#e8f6ed;border:1px solid #cbe9d6;border-radius:20px;padding:3px 10px;white-space:nowrap\">สำเร็จ<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== CHECKOUT MODAL ===== -->\n      <sc-if value=\"{{ checkoutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ closeCheckout }}\" style=\"position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:60;animation:fadeIn .18s ease\"><\u002Fdiv>\n        <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-width:94vw;max-height:92vh;overflow-y:auto;background:#fff;border-radius:18px;z-index:61;box-shadow:0 24px 60px rgba(15,27,45,.3);animation:fadeIn .2s ease\">\n          <sc-if value=\"{{ checkoutNotPaid }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:22px 26px;border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:16px;font-weight:700;color:#0f1b2d\">ชำระเงิน<\u002Fdiv>\n                <div style=\"font-size:12px;color:#94a1b3;margin-top:2px\">{{ checkoutTitle }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ closeCheckout }}\" style=\"flex:none;width:30px;height:30px;border-radius:8px;border:1px solid #e2e7ee;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#7a869a\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:20px 26px\">\n              <div style=\"background:#f7f9fc;border:1px solid #eef1f5;border-radius:11px;padding:14px 16px;margin-bottom:18px\">\n                <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px\"><span style=\"color:#5b6779\">{{ checkoutItem }}<\u002Fspan><span style=\"font-weight:600;color:#0f1b2d;font-family:'IBM Plex Sans'\">{{ checkoutBase }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px\"><span style=\"color:#5b6779\">ที่นั่งเสริม {{ extraSeats }} คน × {{ seatUnitLabel }}<\u002Fspan><span style=\"font-weight:600;color:#0f1b2d;font-family:'IBM Plex Sans'\">{{ extraSeatCost }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ couponApplied }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px\"><span style=\"color:#12813b\">ส่วนลดคูปอง <b style=\"font-family:'IBM Plex Mono'\">{{ couponCode }}<\u002Fb> (−10%)<\u002Fspan><span style=\"font-weight:600;color:#12813b;font-family:'IBM Plex Sans'\">−{{ couponDiscount }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px\"><span style=\"color:#5b6779\">ภาษีมูลค่าเพิ่ม 7%<\u002Fspan><span style=\"font-weight:600;color:#0f1b2d;font-family:'IBM Plex Sans'\">{{ checkoutVat }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #e6ebf1\"><span style=\"font-size:13px;font-weight:700;color:#0f1b2d\">ยอดชำระรวม<\u002Fspan><span style=\"font-size:17px;font-weight:700;color:#2f5fe0;font-family:'IBM Plex Sans'\">{{ checkoutTotal }}<\u002Fspan> n sc-camel-on-click=\"{{ removeCoupon }}\" style=\"border:none;background:transparent;color:#7a869a;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:underline\">นำออก<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-size:12px;font-weight:700;color:#5b6779;margin-bottom:10px\">เลือกช่องทางชำระเงิน<\u002Fdiv>\n              <div style=\"position:relative;margin-bottom:18px\">\n                <button sc-camel-on-click=\"{{ togglePayDropdown }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d9e0e9;background:#fbfcfe;border-radius:11px;padding:12px 15px;font-family:inherit;cursor:pointer\">\n                  <div style=\"flex:1;text-align:left\"><div style=\"font-size:13px;font-weight:700;color:#0f1b2d\">{{ payMethodLabel }}<\u002Fdiv><div style=\"font-size:11px;color:#7a869a;margin-top:1px\">{{ payMethodDesc }}<\u002Fdiv><\u002Fdiv>\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7a869a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"{{ payChevronStyle }}\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ payDropdownOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid #e2e7ee;border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.16);z-index:5;overflow:hidden\">\n                    <sc-for list=\"{{ payMethods }}\" as=\"pm\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ pm.pick }}\" style=\"{{ pm.style }}\">\n                        <div style=\"flex:1;text-align:left\"><div style=\"font-size:13px;font-weight:700;color:#0f1b2d\">{{ pm.label }}<\u002Fdiv><div style=\"font-size:11px;color:#7a869a;margin-top:1px\">{{ pm.desc }}<\u002Fdiv><\ yle=\"{{ twoFAStatusStyle }}\"><span style=\"{{ twoFADotStyle }}\"><\u002Fspan>{{ twoFAStatusLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#94a1b3;margin-bottom:18px\">บัญชีของคุณอยู่ในกลุ่มที่องค์กรบังคับใช้ 2FA · เลือกช่องทางรับรหัส OTP<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;margin-bottom:18px\">\n              <sc-for list=\"{{ mfaMethods }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"{{ m.cardStyle }}\">\n                  <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:3px\">{{ m.title }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#7a869a;line-height:1.45\">{{ m.desc }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ m.activate }}\" style=\"{{ m.btnStyle }}\">{{ m.btnLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <!-- setup: Authenticator App -->\n            <sc-if value=\"{{ setupApp }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#f7f9fc;border:1px solid #dbe4f0;border-radius:12px;padding:18px 20px\">\n                <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:12px\">ตั้งค่า Authenticator App<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5b6779;margin-bottom:9px\">1. เลือกแอปที่ต้องการผูกกับบัญชี<\u002Fdiv>\n                <div style=\"display:flex;gap:9px;margin-bottom:16px\">\n                  <sc-for list=\"{{ authAppOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:18px;align-items:flex-start\">\n                  <div style=\"flex:none;width:110px;height:110px;background:#fff;border:1px solid #dbe4f0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\">\n                    <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3d4d63\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><path d=\"M14 14h3v3h-3zM19 14h2M14 19h2M19 19h2v2M14 21h2\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-size:9.5px;color:#94a1b3;font-weight:600\">QR CODE<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:12px;color:#5b6779;margin-bottom:9px\">2. สแกน QR ด้วยแอปที่เลือก แล้วกรอกรหัส 6 หลักเพื่อยืนยัน<\u002Fdiv>\n                    <input placeholder=\"รหัส 6 หลักจากแอป\" sc-camel-input-mode=\"numeric\" style=\"width:180px;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'IBM Plex Mono';letter-spacing:3px;color:#0f1b2d;background:#fff;margin-bottom:12px\">\n                    <div style=\"display:flex;gap:9px\">\n                      <button sc-camel-on-click=\"{{ confirmSetup }}\" style=\"background:#16a34a;border:none;color:#fff;border-radius:9px;padding:9px 18px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยืนยันการเชื่อมต่อ<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ cancelSetup }}\" style=\"background:#fff;border:1px solid #d9e0e9;color:#5b6779;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยกเลิก<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <!-- setup: SMS OTP -->\n            <sc-if value=\"{{ setupSms }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#f7f9fc;border:1px solid #dbe4f0;border-radius:12px;padding:18px 20px\">\n                <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:12px\">ตั้งค่า SMS OTP<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5b6779;margin-bottom:9px\">ผูกกับเบอร์โทรศัพท์ที่ระบุในข้อมูลส่วนตัว — ระบบจะส่งรหัส 6 หลักไปยืนยัน<\u002Fdiv>\n                <div style=\"display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap\">\n                  <input sc-camel-default-value=\"{{ profile.phone }}\" style=\"width:190px;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fff\">\n                  <button sc-camel-on-click=\"{{ sendOtp }}\" style=\"{{ sendOtpStyle }}\">{{ sendOtpLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:9px;align-items:center\">\n                  <input placeholder=\"รหัส OTP 6 หลัก\" sc-camel-input-mode=\"numeric\" style=\"width:180px;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'IBM Plex Mono';letter-spacing:3px;color:#0f1b2d;background:#fff\">\n                  <button sc-camel-on-click=\"{{ confirmSetup }}\" style=\"background:#16a34a;border:none;color:#fff;border-radius:9px;padding:9px 18px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยืนยันการเชื่อมต่อ<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ cancelSetup }}\" style=\"background:#fff;border:1px solid #d9e0e9;color:#5b6779;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยกเลิก<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <!-- setup: Email OTP -->\n            <sc-if value=\"{{ setupEmail }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#f7f9fc;border:1px solid #dbe4f0;border-radius:12px;padding:18px 20px\">\n                <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:12px\">ตั้งค่า Email OTP<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5b6779;margin-bottom:9px\">ผูกกับอีเมลที่ระบุในข้อมูลส่วนตัว — ระบบจะส่งรหัสไปยืนยัน<\u002Fdiv>\n                <div style=\"display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap\">\n                  <input sc-camel-default-value=\"{{ profile.email }}\" style=\"width:240px;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Sans';color:#0f1b2d;background:#fff\">\n                  <button sc-camel-on-click=\"{{ sendOtp }}\" style=\"{{ sendOtpStyle }}\">{{ sendOtpLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:9px;align-items:center\">\n                  <input placeholder=\"รหัส OTP 6 หลัก\" sc-camel-input-mode=\"numeric\" style=\"width:180px;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'IBM Plex Mono';letter-spacing:3px;color:#0f1b2d;background:#fff\">\n                  <button sc-camel-on-click=\"{{ confirmSetup }}\" style=\"background:#16a34a;border:none;color:#fff;border-radius:9px;padding:9px 18px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยืนยันการเชื่อมต่อ<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ cancelSetup }}\" style=\"background:#fff;border:1px solid #d9e0e9;color:#5b6779;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ยกเลิก<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== APPROVALS ===== -->\n      <sc-if value=\"{{ isApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px;max-width:900px\">\n        <sc-if value=\"{{ approvalsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:48px;text-align:center\">\n            <svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:10px\"><path d=\"M9 11l3 3 8-8\"><\u002Fpath><path d=\"M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:14px;font-weight:600;color:#0f1b2d\">ไม่มีคำขอค้างอนุมัติ<\u002Fdiv>\n            <div style=\"font-size:12px;color:#94a1b3;margin-top:4px\">คำขอแก้ไข/ลบดีลจากทีมขายจะแสดงที่นี่<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ approvalRows }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,27,45,.04)\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px\">\n                <div style=\"width:36px;height:36px;flex:none;border-radius:50%;background:#eaf0fb;color:#2f5fe0;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ a.initial }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                    <span style=\"{{ a.typeStyle }}\">{{ a.typeLabel }}<\u002Fspan>\n                    <span style=\"font-size:13px;font-weight:700;color:#0f1b2d\">{{ a.company }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:#7a869a;margin-top:3px\">{{ a.project }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#3f4a5a;line-height:1.5;margin-top:8px;background:#f7f9fc;border:1px solid #eef1f5;border-radius:9px;padding:9px 12px\">{{ a.note }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#a3aec0;margin-top:7px\">ผู้ขอ: {{ a.requester }} · {{ a.time }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;flex:none\">\n                  <button sc-camel-on-click=\"{{ a.approve }}\" style=\"background:#16a34a;color:#fff;border:none;border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">อนุมัติ<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.reject }}\" style=\"background:#fff;color:#c02020;border:1px solid #f2dedd;border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">ปฏิเสธ<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== USERS & PERMISSIONS ===== -->\n      <sc-if value=\"{{ isUsers }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 30px 48px\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px\">\n          <div style=\"font-size:13px;color:#7a869a\">ทั้งหมด <b style=\"color:#0f1b2d\">{{ userCount }}<\u002Fb> บัญชี · เปิด 2FA แล้ว <b style=\"color:#12813b\">{{ twoFACount }}<\u002Fb> คน<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ addUserBtn }}\" style=\"margin-left:auto;display:flex;align-items:center;gap:7px;background:#2f5fe0;color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer\">+ สร้างพนักงานใหม่<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ addUserOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ closeAddUser }}\" style=\"position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:50;animation:fadeIn .18s ease\"><\u002Fdiv>\n          <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;max-width:94vw;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:26px 30px;z-index:51;box-shadow:0 24px 60px rgba(15,27,45,.32);animation:fadeIn .2s ease\">\n            <div style=\"display:flex;align-items:center;margin-bottom:4px\">\n              <div style=\"font-size:15px;font-weight:700;color:#0f1b2d\">สร้างพนักงานใหม่ (พนักงานขาย)<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ closeAddUser }}\" style=\"margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid #e2e7ee;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#7a869a\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#94a1b3;margin-bottom:20px\">ระบบจะสร้างบัญชีพร้อมส่งลิงก์ตั้งรหัสผ่านครั้งแรกไปยังอีเมล และบังคับเปิด 2FA ก่อนใช้งาน<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:20px\">\n              <div style=\"position:relative;flex:none;cursor:pointer\">\n                <div style=\"width:68px;height:68px;border-radius:50%;background:#f1f4f8;border:1.6px dashed #c3cdda;display:flex;align-items:center;justify-content:center\">\n                  <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8a97ad\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21v-1a7 7 0 0 1 14 0v1\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:#2f5fe0;border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center\">\n                  <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600;color:#0f1b2d\">รูปโปรไฟล์พนักงาน<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#94a1b3;margin-top:2px\">คลิกหรือลากรูปมาวาง · JPG, PNG (สูงสุด 5 MB)<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px;margin-bottom:16px\">\n              <sc-for list=\"{{ empFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <div>\n                  <label style=\"font-size:12px;font-weight:600;color:#5b6779;display:block;margin-bottom:6px\">{{ f.label }} <span style=\"color:#dc2626\">*<\u002Fspan><\u002Flabel>\n                  <input sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;color:#0f1b2d;background:#fbfcfe\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #eef1f5;padding-top:18px;margin-bottom:16px\">\n              <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:12px\">บัญชีเข้าสู่ระบบ (User &amp; Password)<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:14px\">\n                <div>\n                  <label style=\"font-size:12px;font-weight:600;color:#5b6779;di woFALabel }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ u.permBtns }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-start\">\n                <button sc-camel-on-click=\"{{ u.resetPw }}\" style=\"{{ u.resetStyle }}\">{{ u.resetLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ u.chooserOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:5px;background:#f7f9fc;border:1px solid #dbe4f0;border-radius:9px;padding:8px\">\n                    <button sc-camel-on-click=\"{{ u.sendToken }}\" style=\"border:none;background:#2f5fe0;color:#fff;border-radius:6px;padding:5px 10px;font-size:10.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap\">ส่ง Token ให้ user เปลี่ยนเอง<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ u.pickAdminSet }}\" style=\"border:1px solid #d9e0e9;background:#fff;color:#5b6779;border-radius:6px;padding:5px 10px;font-size:10.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap\">IT Admin ตั้งรหัสใหม่ให้<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ u.adminMode }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:5px;background:#f7f9fc;border:1px solid #dbe4f0;border-radius:9px;padding:8px\">\n                    <div style=\"position:relative\">\n                      <input type=\"{{ adminPwFieldType }}\" placeholder=\"รหัสผ่านใหม่\" style=\"width:130px;border:1px solid #d9e0e9;border-radius:6px;padding:5px 26px 5px 8px;font-size:11px;font-family:inherit;color:#0 Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:20px 24px;box-shadow:0 1px 2px rgba(15,27,45,.04)\">\n          <div style=\"font-size:13px;font-weight:700;color:#0f1b2d;margin-bottom:14px\">บันทึกเหตุการณ์ความปลอดภัย (Audit Log)<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:12px;font-size:12px;align-items:baseline\"><span style=\"flex:none;color:#a3aec0;font-family:'IBM Plex Sans';width:130px\">18 ก.ค. 2569 08:42<\u002Fspan><span style=\"color:#3f4a5a\">ล็อกอินสำเร็จ (2FA) — james@company.co.th จาก IP สำนักงานใหญ่<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;font-size:12px;align-items:baseline\"><span style=\"flex:none;color:#a3aec0;font-family:'IBM Plex Sans';width:130px\">18 ก.ค. 2569 07:15<\u002Fspan><span style=\"color:#c02020\">WAF บล็อกความพยายาม SQL Injection จาก IP ต่างประเทศ (3 ครั้ง)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;font-size:12px;align-items:baseline\"><span style=\"flex:none;color:#a3aec0;font-family:'IBM Plex Sans';width:130px\">17 ก.ค. 2569 18:30<\u002Fspan><span style=\"color:#3f4a5a\">ปรับสิทธิ์ผู้ใช้ — theeradej@company.co.th เพิ่มสิทธิ์ \"แก้ไขดีล\" ให้ nattaporn@company.co.th<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;font-size:12px;align-items:baseline\"><span style=\"flex:none;color:#a3aec0;font-family:'IBM Plex Sans';width:130px\">17 ก.ค. 2569 02:00<\u002Fspan><span style=\"color:#3f4a5a\">สำรองข้อมูลรายวันสำเร็จ (ฐานข้อมูล + ไฟล์ TOR, 4.2 GB)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;font-size:12px;align-items:baseline\"><span style=\"flex:none;color:#a3aec0;font-family:'IBM Plex Sans';width:130px\">16 ก.ค. 2569 15:10<\u002Fspan><span style=\"color:#b06a12\">ล็อกอินล้มเหลว 5 ครั้งติดต่อกัน — peerapol@ \u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:30px 34px;box-shadow:0 1px 3px rgba(15,27,45,.05)\">\n\n            <!-- STEP 1 -->\n            <sc-if value=\"{{ formIs1 }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:16px;font-weight:700;color:#0f1b2d;margin-bottom:4px\">ขั้นที่ 1 · ข้อมูลลูกค้าและผู้ติดต่อ<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#94a1b3;margin-bottom:24px\">ระบุหน่วยงานและผู้ติดต่อหลักของดีล<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 20px\">\n                <div style=\"position: relative\"><label style=\"font-size:12.5px;font-weight:600;color:#5b6779;display:block;margin-bottom:7px\">รหัสหน่วยงาน (ตัวเลข) <span style=\"color:#dc2626\">*<\u002Fspan><\u002Flabel><input value=\"{{ orgCode }}\" sc-camel-on-change=\"{{ onOrgCode }}\" sc-camel-input-mode=\"numeric\" placeholder=\"เช่น 001\" style=\"width: 331px; border: 1px solid #d9e0e9; border-radius: 9px; padding: 11px 13px; font-size: 13.5px; font-family: 'IBM Plex Sans'; color: #0f1b2d; background: #fbfcfe; height: 37px\"><\u002Fdiv>\n                <div style=\"position:relative\"><label style=\"font-size:12.5px;font-weight:600;color:#5b6779;display:block;margin-bottom:7px\">ชื่อหน่วยงาน / บริษัท <span style=\"color:#dc2626\">*<\u002Fspan><\u002Flabel>\n                  <input value=\"{{ orgQuery }}\" sc-camel-on-change=\"{{ onOrgQuery }}\" sc-camel-on-focus=\"{{ onOrgFocus }}\" placeholder=\"พิมพ์ชื่อหน่วยงาน หรือเลือกจากรายการ\" style=\"width:100%;border:1px solid #d9e0e9;border-radius:9px;padding:11px 13px;font-size:13.5px;font-family:inherit;color:#0f1b2d;background:#fbfcfe\">\n                  <sc-if value=\"{{ orgListOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid #e2e7ee;border-radius te({}); },\n          remove:()=>{ const idx=this.deals.findIndex(x=>x.id===d.id); if(idx>-1){ this.deals[idx].plan=(this.deals[idx].plan||[]).filter(x=>x.id!==p.id); } this.setState({}); },\n        })),\n        planDoneCount:(d.plan||[]).filter(p=>p.done).length,\n        planTotalCount:(d.plan||[]).length,\n        hasPending: this.approvals.some(a=>a.dealId===d.id),\n      };\n      out.newPlanTask = this.state.newPlanTask;\n      out.newPlanDue = this.state.newPlanDue;\n      out.onNewPlanTask = (e)=>this.setState({newPlanTask:e.target.value});\n      out.onNewPlanDue = (e)=>this.setState({newPlanDue:e.target.value});\n      out.addPlanItem = ()=>{\n        const t=(this.state.newPlanTask||'').trim();\n        if(!t) return;\n        const idx=this.deals.findIndex(x=>x.id===this.state.panelId);\n        if(idx>-1){\n          this.deals[idx].plan = [...(this.deals[idx].plan||[]), {id:'p'+Date.now(), task:t, due:this.state.newPlanDue||'ยังไม่ระบุวันที่', done:false}];\n        }\n        this.setState({newPlanTask:'', newPlanDue:''});\n      };\n    }\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
